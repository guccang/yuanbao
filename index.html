// ═══════════════════════════════════════
//  SOUND SYSTEM (Web Audio API)
// ═══════════════════════════════════════
let audioCtx = null;
let engineGain = null;
let engineOsc = null;
let engineFilter = null;
let audioInitialized = false;

function initAudio() {
  if (audioInitialized) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineGain.connect(audioCtx.destination);
    audioInitialized = true;
  } catch(e) {
    // Audio not available
  }
}

function ensureEngineRunning() {
  if (!audioCtx || engineOsc) return;
  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  engineFilter = audioCtx.createBiquadFilter();
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 180;
  engineFilter.Q.value = 2;
  engineOsc.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineOsc.start();
  // Add a sub-oscillator for richness
  const sub = audioCtx.createOscillator();
  sub.type = 'triangle';
  sub.frequency.value = 35;
  const subGain = audioCtx.createGain();
  subGain.gain.value = 0.3;
  sub.connect(subGain);
  subGain.connect(engineFilter);
  sub.start();
}

function updateEngineSound(speed, isMoving) {
  if (!audioCtx || !engineGain) return;
  ensureEngineRunning();
  const targetVol = isMoving ? 0.018 * Math.min(speed / NORMAL_SPEED, 2.5) : 0;
  engineGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.15);
  if (engineOsc && isMoving) {
    const freq = 50 + speed * 4 + Math.sin(audioCtx.currentTime * 12) * 2;
    engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
  }
}

function playTone(freq, duration, type, vol, freqEnd) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol, freq) {
  if (!audioCtx) return;
  const bufferSize = Math.floor(audioCtx.sampleRate * duration);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = freq || 600;
  filter.Q.value = 1.5;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(audioCtx.currentTime);
}

function dist(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function lerp(a, b, t) { return a + (b - a) * t; }

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function spawnParticles(x, y, count, color, spread) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * spread,
      vy: -(Math.random() * spread * 1.4 + 1),
      life: 1,
      decay: 0.015 + Math.random() * 0.03,
      size: 2 + Math.random() * 5,
      color,
    });
  }
}

function spawnSparkles(x, y, count) {

}

// Transform a world-space point to truck-local space
function toTruckLocal(wx, wy) {
  const dx = wx - truck.x;
  const dy = wy - truck.y;
  const cos = Math.cos(-truck.angle);
  const sin = Math.sin(-truck.angle);
  return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
}

// ═══════════════════════════════════════
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#B3E5FC');
  sky.addColorStop(0.5, '#E1F5FE');
  sky.addColorStop(1, '#C8E6C9');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#A5D6A7';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#C8E6C9';
  ctx.beginPath(); ctx.arc(150, 480, 80, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(450, 500, 100, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(750, 100, 70, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(820, 520, 60, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(60, 80, 50, 0, Math.PI * 2); ctx.fill();

  clouds.forEach(c => {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    const cx = c.x, cy = c.y, s = c.size;
    ctx.beginPath(); ctx.arc(cx, cy, 22 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 20 * s, cy - 8 * s, 18 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 36 * s, cy, 20 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 16 * s, cy + 5 * s, 16 * s, 0, Math.PI * 2); ctx.fill();
  });

  ctx.fillStyle = '#81C784';
  for (let i = 0; i < 60; i++) {
    const gx = (i * 137 + 53) % W;
    const gy = (i * 89 + 127) % H;
    if (gy > ROAD.top - 50 && gy < ROAD.top) continue;
    if (gy > ROAD.bottom && gy < ROAD.bottom + 50) continue;
    ctx.beginPath(); ctx.arc(gx, gy, 1.5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawRoad() {
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = ROAD.width + 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(ROAD.left, ROAD.top);
  ctx.lineTo(ROAD.right, ROAD.top);
  ctx.lineTo(ROAD.right, ROAD.bottom);
  ctx.lineTo(ROAD.left, ROAD.bottom);
  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle = '#BDBDBD';
  ctx.lineWidth = ROAD.width;
  ctx.beginPath();
  ctx.moveTo(ROAD.left, ROAD.top);
  ctx.lineTo(ROAD.right, ROAD.top);
  ctx.lineTo(ROAD.right, ROAD.bottom);
  ctx.lineTo(ROAD.left, ROAD.bottom);
  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle = '#D7CCC8';
  ctx.lineWidth = ROAD.width - 12;
  ctx.beginPath();
  ctx.moveTo(ROAD.left + 1, ROAD.top);
  ctx.lineTo(ROAD.right - 1, ROAD.top);
  ctx.lineTo(ROAD.right - 1, ROAD.bottom);
  ctx.lineTo(ROAD.left + 1, ROAD.bottom);
  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle = '#EEEEEE';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([18, 16]);
  ctx.beginPath();
  ctx.moveTo(ROAD.left, ROAD.top + 2);
  ctx.lineTo(ROAD.right, ROAD.top + 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ROAD.right - 2, ROAD.top);
  ctx.lineTo(ROAD.right - 2, ROAD.bottom);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ROAD.right, ROAD.bottom - 2);
  ctx.lineTo(ROAD.left, ROAD.bottom - 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ROAD.left + 2, ROAD.bottom);
  ctx.lineTo(ROAD.left + 2, ROAD.top);
  ctx.stroke();
  ctx.setLineDash([]);

  // Add sidewalk for bins
  ctx.fillStyle = '#D7CCC8';
  ctx.fillRect(ROAD.left - 8, ROAD.top - ROAD_HALF - 8, ROAD.right - ROAD.left + 16, 8);
  ctx.fillRect(ROAD.left - 8, ROAD.bottom + ROAD_HALF, ROAD.right - ROAD.left + 16, 8);
  ctx.fillRect(ROAD.left - ROAD_HALF - 8, ROAD.top - 8, 8, ROAD.bottom - ROAD.top + 16);
  ctx.fillRect(ROAD.right + ROAD_HALF, ROAD.top - 8, 8, ROAD.bottom - ROAD.top + 16);

  ctx.strokeStyle = '#A1887F';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ROAD.left, ROAD.top - ROAD_HALF);
  ctx.lineTo(ROAD.right, ROAD.top - ROAD_HALF);
  ctx.moveTo(ROAD.right - ROAD_HALF, ROAD.top);
  ctx.lineTo(ROAD.right - ROAD_HALF, ROAD.bottom);
  ctx.moveTo(ROAD.right, ROAD.bottom + ROAD_HALF);
  ctx.lineTo(ROAD.left, ROAD.bottom + ROAD_HALF);
  ctx.moveTo(ROAD.left + ROAD_HALF, ROAD.bottom);
  ctx.lineTo(ROAD.left + ROAD_HALF, ROAD.top);
  ctx.stroke();

  ctx.fillStyle = '#BDBDBD';
  ctx.fillRect(ROAD.right - 10, ROAD.bottom + ROAD_HALF, 50, 28);
  ctx.strokeStyle = '#A1887F';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ROAD.right - 10, ROAD.bottom + ROAD_HALF);
  ctx.lineTo(ROAD.right + 40, ROAD.bottom + ROAD_HALF);
  ctx.moveTo(ROAD.right - 10, ROAD.bottom + ROAD_HALF + 28);
  ctx.lineTo(ROAD.right + 40, ROAD.bottom + ROAD_HALF + 28);
  ctx.stroke();
}

function drawBinBody(bin, x, y, tiltAngle) {
  ctx.save();
  ctx.translate(x, y);
  if (tiltAngle) ctx.rotate(tiltAngle);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(-10, -7, 22, 18);

  // Body with gradient
  const bodyGrad = ctx.createLinearGradient(-9, -10, -9, 8);
  if (bin.full) {
    bodyGrad.addColorStop(0, '#FFAB91');
    bodyGrad.addColorStop(0.5, '#FF8A65');
    bodyGrad.addColorStop(1, '#E64A19');
  } else {
    bodyGrad.addColorStop(0, '#C7B7AE');
    bodyGrad.addColorStop(0.5, '#BCAAA4');
    bodyGrad.addColorStop(1, '#8D6E63');
  }
  ctx.fillStyle = bodyGrad;
  rrect(-9, -10, 20, 18, 4);
  ctx.fill();

  // Subtle corrugated texture
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 0.5;
  for (let lx = -6; lx <= 4; lx += 3) {
    ctx.beginPath();
    ctx.moveTo(lx, -9);
    ctx.lineTo(lx, 7);
    ctx.stroke();
  }

  // Lid
  if (bin.full) {
    ctx.fillStyle = '#BF360C';
    rrect(-10, -12, 22, 6, 3);
    ctx.fill();
    const lidGrad = ctx.createLinearGradient(0, -12, 0, -6);
    lidGrad.addColorStop(0, '#E64A19');
    lidGrad.addColorStop(1, '#BF360C');
    ctx.fillStyle = lidGrad;
    rrect(-10, -12, 22, 6, 3);
    ctx.fill();
    // Handle
    ctx.strokeStyle = '#8B2500';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(1, -9, 4, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  } else {
    ctx.fillStyle = '#795548';
    rrect(6, -10, 8, 5, 2);
    ctx.fill();
  }

  // Highlight edge
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  rrect(-9, -10, 20, 18, 4);
  ctx.stroke();

  // Recycle symbol (on body, not lid)
  if (bin.full) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♻', 1, 1);
  }

  ctx.restore();
}

function drawBin(b) {
  drawBinBody(b, b.x, b.y, 0);

  // Called indicator (pulsing circle above)
  if (b.called) {
    const pulse = Math.sin(performance.now() / 250) * 0.3 + 0.5;
    ctx.fillStyle = 'rgba(255,235,59,' + pulse + ')';
    ctx.beginPath(); ctx.arc(b.x, b.y - 16, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#FBC02D';
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.arc(b.x, b.y - 16, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    // Arrow pointing down
    ctx.fillStyle = '#FBC02D';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y - 28);
    ctx.lineTo(b.x - 5, b.y - 22);
    ctx.lineTo(b.x + 5, b.y - 22);
    ctx.closePath();
    ctx.fill();
  }

  // Refill progress bar
  if (!b.full && b.refillTimer > 0) {
    const progress = 1 - (b.refillTimer / BIN_REFILL_MS);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(b.x - 9, b.y - 18, 20, 4);
    const progGrad = ctx.createLinearGradient(b.x - 9, 0, b.x + 11, 0);
    progGrad.addColorStop(0, '#66BB6A');
    progGrad.addColorStop(1, '#43A047');
    ctx.fillStyle = progGrad;
    ctx.fillRect(b.x - 9, b.y - 18, 20 * progress, 4);
  }
}

function drawTruck() {
  ctx.save();
  ctx.translate(truck.x, truck.y);
  ctx.rotate(truck.angle);

  const w = 62, h = 32;
  const dumping = truck.state === 'dumping' || truck.state === 'station';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(0, h / 2 + 3, w / 2, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // === MAIN BODY (green) ===
  const bodyGrad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  bodyGrad.addColorStop(0, '#81C784');
  bodyGrad.addColorStop(0.4, '#4CAF50');
  bodyGrad.addColorStop(1, '#2E7D32');
  ctx.fillStyle = bodyGrad;
  rrect(-w / 2, -h / 2, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = '#1B5E20';
  ctx.lineWidth = 1.5;
  rrect(-w / 2, -h / 2, w, h, 8);
  ctx.stroke();

  // === CAB (white top + green bottom) ===
  ctx.fillStyle = '#F5F5F5';
  rrect(w / 2 - 26, -h / 2 + 1, 28, h * 0.6, 7);
  ctx.fill();
  ctx.fillStyle = '#2E7D32';
  rrect(w / 2 - 26, -h / 2 + h * 0.55, 28, h / 2 - h * 0.55 + 1, 5);
  ctx.fill();
  // Cab divider line
  ctx.strokeStyle = '#1B5E20';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(w / 2 - 26, -h / 2 + h * 0.55);
  ctx.lineTo(w / 2 + 2, -h / 2 + h * 0.55);
  ctx.stroke();

  // === WINDSHIELD ===
  ctx.fillStyle = '#81D4FA';
  rrect(w / 2 - 18, -h / 2 + 5, 16, h * 0.42, 4);
  ctx.fill();
  ctx.strokeStyle = '#546E7A';
  ctx.lineWidth = 1;
  rrect(w / 2 - 18, -h / 2 + 5, 16, h * 0.42, 4);
  ctx.stroke();
  // Windshield reflection
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(w / 2 - 16, -h / 2 + 7);
  ctx.lineTo(w / 2 - 6, -h / 2 + 7);
  ctx.lineTo(w / 2 - 8, -h / 2 + h * 0.38);
  ctx.lineTo(w / 2 - 16, -h / 2 + h * 0.35);
  ctx.closePath();
  ctx.fill();

  // === HEADLIGHT ===
  ctx.fillStyle = '#FFF9C4';
  ctx.beginPath();
  ctx.arc(w / 2 - 2, -h / 2 + 15, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFEB3B';
  ctx.beginPath();
  ctx.arc(w / 2 - 2, -h / 2 + 15, 3, 0, Math.PI * 2);
  ctx.fill();
  // Light glow
  ctx.fillStyle = 'rgba(255,235,59,0.2)';
  ctx.beginPath();
  ctx.arc(w / 2 - 2, -h / 2 + 15, 8, 0, Math.PI * 2);
  ctx.fill();

  // === FRONT GRILLE ===
  ctx.fillStyle = '#37474F';
  ctx.fillRect(w / 2 - 21, h / 2 - 12, 20, 3);
  ctx.fillRect(w / 2 - 21, h / 2 - 8, 20, 3);
  ctx.fillRect(w / 2 - 21, h / 2 - 4, 20, 3);
  // Bumper
  ctx.fillStyle = '#546E7A';
  rrect(w / 2 - 22, h / 2 - 1, 22, 4, 2);
  ctx.fill();

  // === REAR LIGHT ===
  ctx.fillStyle = '#F44336';
  ctx.beginPath();
  ctx.arc(-w / 2 + 4, h / 2 - 6, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFCDD2';
  ctx.beginPath();
  ctx.arc(-w / 2 + 4, h / 2 - 6, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // === HOPPER / BED SECTION ===
  const hopperGrad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  hopperGrad.addColorStop(0, '#43A047');
  hopperGrad.addColorStop(1, '#2E7D32');
  ctx.fillStyle = hopperGrad;
  rrect(-w / 2 + 2, -h / 2 + 4, 32, h - 8, 5);
  ctx.fill();
  ctx.strokeStyle = '#1B5E20';
  ctx.lineWidth = 1;
  rrect(-w / 2 + 2, -h / 2 + 4, 32, h - 8, 5);
  ctx.stroke();

  // Hopper panel lines (vertical ribs)
  ctx.strokeStyle = '#33691E';
  ctx.lineWidth = 1;
  for (let lx = -w / 2 + 10; lx < -w / 2 + 30; lx += 6) {
    ctx.beginPath();
    ctx.moveTo(lx, -h / 2 + 6);
    ctx.lineTo(lx, h / 2 - 6);
    ctx.stroke();
  }

  // Compactor ram visible on top of hopper
  ctx.fillStyle = '#78909C';
  rrect(-w / 2 + 10, -h / 2 - 2, 8, 5, 2);
  ctx.fill();
  ctx.strokeStyle = '#546E7A';
  ctx.lineWidth = 1;
  rrect(-w / 2 + 10, -h / 2 - 2, 8, 5, 2);
  ctx.stroke();

  // === ARM MOUNT BASE ===
  ctx.fillStyle = '#455A64';
  rrect(-w / 2 + 18, -h / 2 - 6, 16, 8, 3);
  ctx.fill();
  ctx.strokeStyle = '#263238';
  ctx.lineWidth = 1;
  rrect(-w / 2 + 18, -h / 2 - 6, 16, 8, 3);
  ctx.stroke();

  // Pivot circle
  if (!dumping) {
    ctx.fillStyle = '#FFB300';
    ctx.beginPath();
    ctx.arc(-w / 2 + 26, -h / 2 - 2, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#F57F17';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(-w / 2 + 26, -h / 2 - 2, 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // === WHEELS ===
  function drawWheel(wx, wy) {
    // Tire
    ctx.fillStyle = '#212121';
    rrect(wx - 6, wy - 3, 12, 6, 3);
    ctx.fill();
    // Tread marks
    ctx.strokeStyle = '#424242';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(wx - 4, wy - 3); ctx.lineTo(wx - 4, wy + 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wy - 3); ctx.lineTo(wx, wy + 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx + 4, wy - 3); ctx.lineTo(wx + 4, wy + 3); ctx.stroke();
    // Hubcap
    ctx.fillStyle = '#B0BEC5';
    ctx.beginPath(); ctx.arc(wx, wy, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#78909C';
    ctx.beginPath(); ctx.arc(wx, wy, 1.2, 0, Math.PI * 2); ctx.fill();
  }

  drawWheel(-w / 2 + 10, -h / 2);
  drawWheel(-w / 2 + 10, h / 2);
  drawWheel(w / 2 - 14, -h / 2);
  drawWheel(w / 2 - 14, h / 2);

  // === CUTE FACE ===
  const fx = w / 2 - 5, fy = -h / 2 + h * 0.78;
  // Eyes
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(fx - 3, fy - 1, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 5, fy - 1, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#212121';
  ctx.beginPath(); ctx.arc(fx - 2, fy - 1, 2.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 6, fy - 1, 2.3, 0, Math.PI * 2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(fx - 3, fy - 2.5, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 5, fy - 2.5, 1, 0, Math.PI * 2); ctx.fill();
  // Smile
  ctx.strokeStyle = '#212121';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(fx + 2, fy, 4, 0.2, Math.PI - 0.2);
  ctx.stroke();
  // Rosy cheeks
  ctx.fillStyle = 'rgba(255,138,101,0.3)';
  ctx.beginPath(); ctx.arc(fx - 5, fy + 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 9, fy + 2, 3, 0, Math.PI * 2); ctx.fill();

  // === ROOF BEACON LIGHT ===
  if (!dumping) {
    const beaconAlpha = 0.5 + Math.sin(performance.now() / 300) * 0.3;
    ctx.fillStyle = 'rgba(255,183,77,' + beaconAlpha + ')';
    ctx.beginPath();
    ctx.arc(w / 2 - 10, -h / 2 - 1, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // === BOOST EFFECT ===
  if (truck.boostTimer > 0) {
    ctx.fillStyle = 'rgba(255,235,59,0.25)';
    rrect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 10);
    ctx.fill();
    ctx.strokeStyle = '#FFD54F';
    ctx.lineWidth = 2;
    for (let s = 0; s < 4; s++) {
      const sx = -w / 2 - 10 - s * 9;
      const sy = -h / 2 + 5 + s * 6;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - 12, sy - 2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawArmAndBin(progress) {
  if (!truck.dumpBin) return;
  const bin = truck.dumpBin;
  const w = 62, h = 32;

  // Arm base in truck local coordinates
  const armBaseLX = -w / 2 + 26;
  const armBaseLY = -h / 2 - 2;

  // Bin position in truck local coordinates
  const binLocal = toTruckLocal(bin.x, bin.y);

  // Calculate arm tip position based on progress
  let tipLX, tipLY;

  if (progress < 0.25) {
    // Phase 1: Arm extending toward bin
    const t = clamp(progress / 0.25, 0, 1);
    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    tipLX = armBaseLX + (binLocal.x - armBaseLX) * eased;
    tipLY = armBaseLY + (binLocal.y - armBaseLY) * eased;
  } else if (progress < 0.35) {
    // Phase 2: Gripping at bin
    tipLX = binLocal.x;
    tipLY = binLocal.y;
  } else if (progress < 0.60) {
    // Phase 3: Lifting bin up and toward truck
    const t = clamp((progress - 0.35) / 0.25, 0, 1);
    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    const liftTargetX = armBaseLX + 4;
    const liftTargetY = armBaseLY - 50;
    tipLX = binLocal.x + (liftTargetX - binLocal.x) * eased;
    tipLY = binLocal.y + (liftTargetY - binLocal.y) * eased;
  } else if (progress < 0.80) {
    // Phase 4: Holding bin above truck (dumping)
    tipLX = armBaseLX + 4;
    tipLY = armBaseLY - 50;
  } else {
    // Phase 5: Returning bin to position and retracting
    const t = clamp((progress - 0.80) / 0.20, 0, 1);
    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    tipLX = (armBaseLX + 4) + (binLocal.x - (armBaseLX + 4)) * eased;
    tipLY = (armBaseLY - 50) + (binLocal.y - (armBaseLY - 50)) * eased;
  }

  // Calculate elbow position (midpoint with offset upward)
  const midX = armBaseLX + (tipLX - armBaseLX) * 0.55;
  const midY = armBaseLY + (tipLY - armBaseLY) * 0.45 - 14;

  // Draw hydraulic cylinder (from base toward mid)
  ctx.strokeStyle = '#78909C';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(armBaseLX - 2, armBaseLY - 4);
  ctx.lineTo(midX - 3, midY - 3);
  ctx.stroke();

  // Outer cylinder casing
  ctx.strokeStyle = '#90A4AE';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(armBaseLX - 2, armBaseLY - 4);
  ctx.lineTo(armBaseLX - 2 + (midX - 3 - armBaseLX + 2) * 0.4, armBaseLY - 4 + (midY - 3 - armBaseLY + 4) * 0.4);
  ctx.stroke();

  // Lower arm segment (thick)
  ctx.strokeStyle = '#FFB300';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(armBaseLX, armBaseLY);
  ctx.lineTo(midX, midY);
  ctx.stroke();

  // Lower arm outline
  ctx.strokeStyle = '#F57F17';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(armBaseLX, armBaseLY);
  ctx.lineTo(midX, midY);
  ctx.stroke();
  ctx.strokeStyle = '#FFB300';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(armBaseLX, armBaseLY);
  ctx.lineTo(midX, midY);
  ctx.stroke();

  // Upper arm segment
  ctx.strokeStyle = '#F57F17';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(midX, midY);
  ctx.lineTo(tipLX, tipLY);
  ctx.stroke();
  ctx.strokeStyle = '#FFB300';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(midX, midY);
  ctx.lineTo(tipLX, tipLY);
  ctx.stroke();

  // Elbow joint
  ctx.fillStyle = '#E65100';
  ctx.beginPath();
  ctx.arc(midX, midY, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#BF360C';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(midX, midY, 4, 0, Math.PI * 2);
  ctx.stroke();

  // Shoulder joint
  ctx.fillStyle = '#E65100';
  ctx.beginPath();
  ctx.arc(armBaseLX, armBaseLY, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#BF360C';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(armBaseLX, armBaseLY, 5, 0, Math.PI * 2);
  ctx.stroke();

  // === GRIPPER ===
  const gripOpen = progress < 0.30;
  if (gripOpen) {
    // Open claw
    ctx.strokeStyle = '#616161';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    // Left claw
    ctx.beginPath();
    ctx.moveTo(tipLX, tipLY);
    ctx.lineTo(tipLX - 8, tipLY - 9);
    ctx.stroke();
    // Right claw
    ctx.beginPath();
    ctx.moveTo(tipLX, tipLY);
    ctx.lineTo(tipLX + 8, tipLY - 9);
    ctx.stroke();
  } else {
    // Closed gripper (holding bin)
    ctx.strokeStyle = '#616161';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tipLX - 3, tipLY);
    ctx.lineTo(tipLX - 3, tipLY - 10);
    ctx.moveTo(tipLX + 3, tipLY);
    ctx.lineTo(tipLX + 3, tipLY - 10);
    ctx.stroke();
    // Bottom support
    ctx.beginPath();
    ctx.moveTo(tipLX - 5, tipLY - 10);
    ctx.lineTo(tipLX + 5, tipLY - 10);
    ctx.stroke();
  }

  // Draw lifted bin during lift/hold phases
  if (progress >= 0.35 && progress < 0.85) {
    const tilt = progress < 0.60
      ? -0.2 - (progress - 0.35) / 0.25 * 1.3
      : -1.5;
    const binX = tipLX;
    const binY = tipLY - (gripOpen ? 0 : 8);
    // Draw bin tilted (dumping into truck)
    ctx.save();
    ctx.translate(binX, binY);
    ctx.rotate(tilt);

    // Mini bin body
    ctx.fillStyle = '#FF8A65';
    rrect(-9, -10, 20, 18, 4);
    ctx.fill();
    ctx.fillStyle = '#BF360C';
    rrect(-10, -12, 22, 6, 3);
    ctx.fill();

    // Trash falling out
    if (progress >= 0.50) {
      ctx.fillStyle = '#8BC34A';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-4 + i * 5, -6 + Math.random() * 16, 2 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#FFB74D';
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.arc(2 + i * 4, -4 + Math.random() * 14, 1.5 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }
}

function drawUI() {
  if (truck.state === 'station' || truck.state === 'to_station') {
    const t = performance.now() / 400;
    const alpha = 0.5 + Math.sin(t) * 0.3;
    ctx.fillStyle = 'rgba(255,235,59,' + alpha + ')';
    ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌟 去倒垃圾啦！🌟', W / 2, 40);
  }

  ctx.fillStyle = '#5D4037';
  ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('垃圾车收集了 ' + score + ' 个垃圾！', W - 15, H - 12);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = 'rgba(' + p.color + ',' + p.life + ')';
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  sparkles.forEach(s => {
    ctx.fillStyle = 'rgba(255,235,59,' + s.life + ')';
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.life * 4);
    ctx.beginPath();
    const sz = s.size * s.life;
    ctx.moveTo(0, -sz);
    ctx.lineTo(sz * 0.3, -sz * 0.3);
    ctx.lineTo(sz, 0);
    ctx.lineTo(sz * 0.3, sz * 0.3);
    ctx.lineTo(0, sz);
    ctx.lineTo(-sz * 0.3, sz * 0.3);
    ctx.lineTo(-sz, 0);
    ctx.lineTo(-sz * 0.3, -sz * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
}

function currentWaypoint() {
  return waypoints[truck.wpIdx];
}

function getBinAtWaypoint(wp) {
  if (wp.type === 'bin') return bins[wp.binIdx];
  return null;
}

// ═══════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════
function updateTruck() {
  // Update boost timer
  if (truck.boostTimer > 0) {
    truck.boostTimer -= 16.67;
    if (truck.boostTimer <= 0) {
      truck.boostTimer = 0;
      truck.speed = NORMAL_SPEED;
    }
  }

  // Dump animation (with arm)
  if (truck.state === 'dumping') {
    truck.dumpTimer -= 16.67;
    const prevProgress = 1 - ((truck.dumpTimer + 16.67) / DUMP_DURATION);
    const progress = 1 - (truck.dumpTimer / DUMP_DURATION);

    // Sound triggers
    if (!truck.armExtendSoundPlayed && progress >= 0.02) {
      playArmExtendSound();
      truck.armExtendSoundPlayed = true;
    }
    if (!truck.gripSoundPlayed && progress >= 0.28) {
      playGripSound();
      truck.gripSoundPlayed = true;
    }
    if (!truck.dumpSoundPlayed && progress >= 0.50) {
      playDumpSound();
      truck.dumpSoundPlayed = true;
    }

    // Spawn particles during dump phase
    if (progress >= 0.50 && progress < 0.78 && Math.random() < 0.55) {
      if (truck.dumpBin) {
        const binLocal = toTruckLocal(truck.dumpBin.x, truck.dumpBin.y);
        const wx = truck.x + binLocal.x * Math.cos(truck.angle) - (binLocal.y - 50) * Math.sin(truck.angle);
        const wy = truck.y + binLocal.x * Math.sin(truck.angle) + (binLocal.y - 50) * Math.cos(truck.angle);
        spawnParticles(wx, wy - 8, 2, '139,195,74', 3);
        spawnParticles(wx, wy - 3, 1, '255,183,77', 2);
        spawnParticles(wx, wy, 1, '158,158,158', 1.5);
      }
    }

    if (truck.dumpTimer <= 0) {
      // Finish dump
      if (truck.dumpBin) {
        truck.dumpBin.full = false;
        truck.dumpBin.refillTimer = BIN_REFILL_MS;
        truck.dumpBin.called = false;
        score++;
        truck.collectedSinceStation++;
        scoreEl.textContent = score;
        spawnSparkles(truck.x, truck.y - 20, 14);
        playPickupSound();

        if (truck.collectedSinceStation >= BINS_FOR_STATION) {
          truck.state = 'to_station';
          truck.targetX = 790;
          truck.targetY = 415;
          truck.collectedSinceStation = 0;
          truck.stationSoundPlayed = false;
        } else {
          truck.state = 'moving';
          truck.wpIdx = (truck.wpIdx + 1) % waypoints.length;
        }
      }
      truck.dumpBin = null;
      truck.armExtendSoundPlayed = false;
      truck.gripSoundPlayed = false;
      truck.dumpSoundPlayed = false;
    }
    return;
  }

  // Driving to station
  if (truck.state === 'to_station') {
    const dx = truck.targetX - truck.x;
    const dy = truck.targetY - truck.y;
    const dist_ = Math.sqrt(dx * dx + dy * dy);
    const spd = truck.speed;
    if (dist_ < spd + 2) {
      truck.x = truck.targetX;
      truck.y = truck.targetY;
      truck.angle = Math.atan2(dy || 0.001, dx || 0.001);
      truck.state = 'station';
      truck.dumpTimer = STATION_DUMP_DURATION;
      playStationSound();
      truck.stationSoundPlayed = true;
    } else {
      const ratio = spd / dist_;
      truck.x += dx * ratio;
      truck.y += dy * ratio;
      truck.angle = Math.atan2(dy, dx);
    }
    return;
  }

  // Station dump animation
  if (truck.state === 'station') {
    truck.dumpTimer -= 16.67;
    if (truck.dumpTimer > 1200 && truck.dumpTimer < 2000 && Math.random() < 0.6) {
      spawnParticles(truck.x - 10, truck.y - 15, 3, '139,195,74', 5);
      spawnParticles(truck.x - 10, truck.y - 10, 2, '255,183,77', 4);
      spawnParticles(truck.x - 10, truck.y - 8, 1, '255,112,67', 3);
    }
    if (truck.dumpTimer <= 1000 && truck.dumpTimer > 960) {
      spawnSparkles(truck.x, truck.y - 25, 20);
      spawnSparkles(790, 430, 15);
      playStationSound();
    }
    if (truck.dumpTimer <= 0) {
      truck.state = 'moving';
      let minD = Infinity, bestI = 0;
      waypoints.forEach((wp, i) => { const d = dist(wp, truck); if (d < minD) { minD = d; bestI = i; } });
      truck.wpIdx = (bestI + 1) % waypoints.length;
      score += 3;
      scoreEl.textContent = score;
    }
    return;
  }

  // Moving toward waypoint
  const target = currentWaypoint();
  const dx = target.x - truck.x;
  const dy = target.y - truck.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const spd = truck.speed;

  if (distance < spd + 1) {
    truck.x = target.x;
    truck.y = target.y;
    truck.angle = Math.atan2(dy || 0.001, dx || 0.001);

    if (target.type === 'bin') {
      const bin = getBinAtWaypoint(target);
      if (bin && bin.full) {
        truck.state = 'dumping';
        truck.dumpTimer = DUMP_DURATION;
        truck.dumpBin = bin;
        truck.armExtendSoundPlayed = false;
        truck.gripSoundPlayed = false;
        truck.dumpSoundPlayed = false;
        return;
      }
    }
    truck.wpIdx = (truck.wpIdx + 1) % waypoints.length;
  } else {
    const ratio = spd / distance;
    truck.x += dx * ratio;
    truck.y += dy * ratio;
    truck.angle = Math.atan2(dy, dx);
  }
}

function updateBins(dt) {
  bins.forEach(b => {
    if (!b.full && b.refillTimer > 0) {
      b.refillTimer -= dt;
      if (b.refillTimer <= 0) {
        b.refillTimer = 0;
        b.full = true;
        spawnSparkles(b.x, b.y, 6);
        playRefillSound();
      }
    }
  });
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy -= 0.05;
    p.life -= p.decay;
    return p.life > 0;
  });
  sparkles = sparkles.filter(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;
    return s.life > 0;
  });
}

function updateClouds() {
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 60) c.x = -60;
  });
}

canvas.addEventListener('click', e => {
  initAudio();
  const pos = canvasPos(e);

  // Menu mode
  if (gameMode === MODES.MENU) {
    for (var mi = 0; mi < menuButtons.length; mi++) {
      var btn = menuButtons[mi];
      if (pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h) {
        switchMode(btn.mode);
        return;
      }
    }
    return;
  }

  // Learning modes
  if (gameMode === MODES.NUMBERS) { nlHandleClick(pos.x, pos.y); return; }
  if (gameMode === MODES.WORDS) { wlHandleClick(pos.x, pos.y); return; }
  if (gameMode === MODES.INTERACTIVE) { ilHandleClick(pos.x, pos.y); return; }

  // Original truck game
  if (dist(pos, truck) < 55) {
    truck.speed = BOOST_SPEED;
    truck.boostTimer = BOOST_DURATION;
    spawnSparkles(truck.x, truck.y, 10);
    playBoostSound();
    return;
  }

  for (var bi = 0; bi < bins.length; bi++) {
    if (dist(pos, bins[bi]) < 38) {
      bins[bi].called = true;
      spawnSparkles(bins[bi].x, bins[bi].y, 8);
      return;
    }
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  if (e.touches.length === 1) {
    const pos = canvasPos(e.touches[0]);

    // Menu mode
    if (gameMode === MODES.MENU) {
      for (var mi2 = 0; mi2 < menuButtons.length; mi2++) {
        var btn2 = menuButtons[mi2];
        if (pos.x >= btn2.x && pos.x <= btn2.x + btn2.w && pos.y >= btn2.y && pos.y <= btn2.y + btn2.h) {
          switchMode(btn2.mode);
          return;
        }
      }
      return;
    }

    // Learning modes
    if (gameMode === MODES.NUMBERS) { nlHandleClick(pos.x, pos.y); return; }
    if (gameMode === MODES.WORDS) { wlHandleClick(pos.x, pos.y); return; }
    if (gameMode === MODES.INTERACTIVE) { ilHandleClick(pos.x, pos.y); return; }

    if (dist(pos, truck) < 60) {
      truck.speed = BOOST_SPEED;
      truck.boostTimer = BOOST_DURATION;
      spawnSparkles(truck.x, truck.y, 10);
      playBoostSound();
      return;
    }
    for (var bi2 = 0; bi2 < bins.length; bi2++) {
      if (dist(pos, bins[bi2]) < 42) {
        bins[bi2].called = true;
        spawnSparkles(bins[bi2].x, bins[bi2].y, 8);
        return;
      }
    }
  }
}, { passive: false });

  // Keep truck state as-is (it persists)
  nlState.score = 0; nlState.streak = 0; nlState.bestStreak = 0;
  nlState.level = 1; nlState.feedback = ''; nlState.feedbackTimer = 0;
  nlState.wrongAnswer = -1;

  wlState.score = 0; wlState.streak = 0; wlState.bestStreak = 0;
  wlState.categoryIdx = 0; wlState.currentWord = null; wlState.options = [];
  wlState.feedback = ''; wlState.feedbackTimer = 0; wlState.wrongIdx = -1;
  wlState.usedWords = [];

  ilState.score = 0; ilState.streak = 0; ilState.bestStreak = 0;
  ilState.step = 'count'; ilState.feedback = ''; ilState.feedbackTimer = 0;

function switchMode(mode) {
  if (mode === MODES.MENU) {
    stopEngineSound();
    headerTitle.textContent = '🎓 趣味学习乐园';
    hintEl.innerHTML = '👆 点击按钮选择游戏模式';
    scoreEl.textContent = '0';
  }
  if (mode === MODES.TRUCK) {
    ensureEngineRunning();
    headerTitle.textContent = '🚛 垃圾车来啦！';
    hintEl.innerHTML = '👆 点垃圾车加速 &nbsp;|&nbsp; 👆 点垃圾桶召唤垃圾车';
    scoreEl.textContent = score;
  }
  if (mode === MODES.NUMBERS) {
    stopEngineSound();
    headerTitle.textContent = '🔢 学数字';
    hintEl.innerHTML = '👆 数一数物品，点击正确的数字吧！';
    scoreEl.textContent = nlState.score;
  }
  if (mode === MODES.WORDS) {
    stopEngineSound();
    headerTitle.textContent = '📖 学单词';
    hintEl.innerHTML = '👆 看中文和图片，选择对应的英文单词！';
    scoreEl.textContent = wlState.score;
  }
  if (mode === MODES.INTERACTIVE) {
    stopEngineSound();
    headerTitle.textContent = '🎮 互动学习';
    hintEl.innerHTML = '👆 先数数，再认单词，双重挑战！';
    scoreEl.textContent = ilState.score;
  }
  gameMode = mode;
  resetAllModes();
  if (mode === MODES.NUMBERS) nlInitRound();
  if (mode === MODES.WORDS) wlInitRound();
  if (mode === MODES.INTERACTIVE) ilInitRound();
}

function stopEngineSound() {

//  NUMBER LEARNING MODE
// ═══════════════════════════════════════
function nlInitRound() {
  var maxNum = nlState.level <= 2 ? 5 : (nlState.level <= 4 ? 10 : (nlState.level <= 6 ? 15 : 20));
  var count = Math.floor(Math.random() * maxNum) + 1;
  nlState.correctAnswer = count;
  nlState.objects = [];
  nlState.feedback = '';
  nlState.feedbackTimer = 0;
  nlState.wrongAnswer = -1;

  // Generate object positions (scattered but not overlapping)
  var usedPositions = [];
  for (var i = 0; i < count; i++) {
    var attempts = 0;
    var px, py, ok;
    do {
      px = 80 + Math.random() * (W - 160);
      py = 120 + Math.random() * 220;
      ok = true;
      for (var j = 0; j < usedPositions.length; j++) {
        if (Math.abs(px - usedPositions[j].x) < 48 && Math.abs(py - usedPositions[j].y) < 48) {
          ok = false;
          break;
        }
      }
      attempts++;
    } while (!ok && attempts < 30);
    usedPositions.push({ x: px, y: py });
    nlState.objects.push({
      x: px, y: py,
      emoji: NL_ITEM_EMOJIS[Math.floor(Math.random() * NL_ITEM_EMOJIS.length)],
      size: 20 + Math.random() * 14,
      angle: (Math.random() - 0.5) * 0.5,
    });
  }

  // Generate number options (including correct answer + 3 distractors)
  nlState.options = [count];
  while (nlState.options.length < 4) {
    var opt = Math.floor(Math.random() * maxNum) + 1;
    if (nlState.options.indexOf(opt) === -1) nlState.options.push(opt);
  }
  // Shuffle
  for (var i2 = nlState.options.length - 1; i2 > 0; i2--) {
    var j2 = Math.floor(Math.random() * (i2 + 1));
    var tmp = nlState.options[i2];
    nlState.options[i2] = nlState.options[j2];
    nlState.options[j2] = tmp;
  }
}

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';

    ctx.textAlign = 'center';
    ctx.fillText(num, bx + btnW / 2, btnY + 40);

  ctx.textAlign = 'center';
  ctx.fillText('👆 数一数物品，点击正确的数字吧！', W / 2, 500);

  // Streak indicator
  if (nlState.streak >= 2) {
    var streakAlpha = 0.6 + Math.sin(t * 3) * 0.3;
    ctx.fillStyle = 'rgba(255,152,0,' + streakAlpha + ')';
    ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('🔥 连对 ' + nlState.streak + ' 次！', W / 2, 530);
  }

  drawParticles();
}

function nlUpdate(dt) {

      nlState.feedback = '';
      nlState.wrongAnswer = -1;
      nlInitRound();

function nlHandleClick(x, y) {
  if (isInsideBackButton(x, y)) {
    switchMode(MODES.MENU);
    return;
  }
  if (nlState.feedbackTimer > 0) return; // Animation playing

  var btnW = 70;
  var totalW = nlState.options.length * btnW + (nlState.options.length - 1) * 16;
  var startX = (W - totalW) / 2;
  var btnY = 390;
  var btnH = 60;

  for (var i = 0; i < nlState.options.length; i++) {
    var bx = startX + i * (btnW + 16);
    if (x >= bx && x <= bx + btnW && y >= btnY && y <= btnY + btnH) {
      var chosen = nlState.options[i];
      if (chosen === nlState.correctAnswer) {
        nlState.score += 10 + nlState.level * 2;
        scoreEl.textContent = nlState.score;
        nlState.streak++;
        if (nlState.streak > nlState.bestStreak) nlState.bestStreak = nlState.streak;
        nlState.feedback = '✅ 太棒了！答对啦！';
        nlState.feedbackTimer = 900;
        spawnSparkles(x, y, 12);
        playPickupSound();
        if (nlState.streak > 0 && nlState.streak % 5 === 0) {
          nlState.level++;
          playStationSound();
        }
      } else {
        nlState.streak = 0;
        nlState.wrongAnswer = chosen;
        nlState.feedback = '❌ 再数一数哦～';
        nlState.feedbackTimer = 1100;
        playTone(200, 0.3, 'sawtooth', 0.06, 80);
      }
      break;
    }
  }
}

function wlInitRound() {
  wlState.feedback = '';
  wlState.feedbackTimer = 0;
  wlState.wrongIdx = -1;

  var cat = WORD_SETS[wlState.categoryIdx];
  // Pick a word we haven't used recently
  var available = [];
  for (var i = 0; i < cat.length; i++) {
    if (wlState.usedWords.indexOf(cat[i].cn) === -1) available.push(cat[i]);
  }
  if (available.length === 0) {
    wlState.usedWords = [];
    available = cat.slice();
  }
  var chosen = available[Math.floor(Math.random() * available.length)];
  wlState.currentWord = chosen;
  wlState.usedWords.push(chosen.cn);
  if (wlState.usedWords.length > cat.length * 2) wlState.usedWords = wlState.usedWords.slice(-cat.length);

  // Build options: correct + 3 distractors from all word sets
  var allWords = [];
  WORD_SETS.forEach(function (set) {
    set.forEach(function (w) { allWords.push(w); });
  });
  wlState.options = [chosen];
  while (wlState.options.length < 4) {
    var opt = allWords[Math.floor(Math.random() * allWords.length)];
    var dup = false;
    for (var j = 0; j < wlState.options.length; j++) {
      if (wlState.options[j].en === opt.en) { dup = true; break; }
    }
    if (!dup) wlState.options.push(opt);
  }
  // Shuffle
  for (var i2 = wlState.options.length - 1; i2 > 0; i2--) {
    var j2 = Math.floor(Math.random() * (i2 + 1));
    var tmp = wlState.options[i2];
    wlState.options[i2] = wlState.options[j2];
    wlState.options[j2] = tmp;
  }
}

// ═══════════════════════════════════════
function ilInitRound() {
  ilState.step = 'count';
  ilState.feedback = '';
  ilState.feedbackTimer = 0;
  ilState.wrongIdx = -1;
  ilState.countAnswer = -1;

  // Pick a random word
  var w = IL_WORDS[Math.floor(Math.random() * IL_WORDS.length)];
  ilState.correctWord = w;
  ilState.correctNumber = Math.floor(Math.random() * 7) + 2; // 2-8
  ilState.emoji = w.emoji;

  // Generate objects for counting
  ilState.objects = [];
  var usedPositions = [];
  for (var i = 0; i < ilState.correctNumber; i++) {
    var attempts = 0;
    var px, py, ok;
    do {
      px = 100 + Math.random() * (W - 200);
      py = 150 + Math.random() * 150;
      ok = true;
      for (var j = 0; j < usedPositions.length; j++) {
        if (Math.abs(px - usedPositions[j].x) < 50 && Math.abs(py - usedPositions[j].y) < 50) {
          ok = false;
          break;
        }
      }
      attempts++;
    } while (!ok && attempts < 20);
    usedPositions.push({ x: px, y: py });
    ilState.objects.push({ x: px, y: py, size: 22 + Math.random() * 14 });
  }

  // Number options
  ilState.numberOptions = [ilState.correctNumber];
  while (ilState.numberOptions.length < 4) {
    var opt = Math.floor(Math.random() * 10) + 1;
    if (ilState.numberOptions.indexOf(opt) === -1) ilState.numberOptions.push(opt);
  }
  for (var i2 = ilState.numberOptions.length - 1; i2 > 0; i2--) {
    var j2 = Math.floor(Math.random() * (i2 + 1));
    var tmp = ilState.numberOptions[i2];
    ilState.numberOptions[i2] = ilState.numberOptions[j2];
    ilState.numberOptions[j2] = tmp;
  }

  // Word options
  ilState.wordOptions = [w];
  while (ilState.wordOptions.length < 4) {
    var ow = IL_WORDS[Math.floor(Math.random() * IL_WORDS.length)];
    var dup = false;
    for (var k = 0; k < ilState.wordOptions.length; k++) {
      if (ilState.wordOptions[k].en === ow.en) { dup = true; break; }
    }
    if (!dup) ilState.wordOptions.push(ow);
  }
  for (var i3 = ilState.wordOptions.length - 1; i3 > 0; i3--) {
    var j3 = Math.floor(Math.random() * (i3 + 1));
    var tmp2 = ilState.wordOptions[i3];
    ilState.wordOptions[i3] = ilState.wordOptions[j3];
    ilState.wordOptions[j3] = tmp2;
  }
}

function ilDraw() {
  // Background
  var ilSky = ctx.createLinearGradient(0, 0, 0, H);
  ilSky.addColorStop(0, '#F3E5F5');
  ilSky.addColorStop(0.5, '#FFF3E0');
  ilSky.addColorStop(1, '#E8F5E9');
  ctx.fillStyle = ilSky;
  ctx.fillRect(0, 0, W, H);

  // Decorative
  ctx.fillStyle = 'rgba(206,147,216,0.2)';
  ctx.beginPath(); ctx.arc(120, 200, 45, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(780, 100, 40, 0, Math.PI * 2); ctx.fill();

  drawBackButton();

  // Header
  ctx.fillStyle = '#6A1B9A';
  ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎮 互动学习 — 数数 + 认单词', W / 2, 52);

  // Score
  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('⭐ ' + ilState.score + ' 分', W - 20, 52);

  var t = performance.now() / 1000;

  // Draw objects
  ilState.objects.forEach(function (obj, i) {
    var bobY = Math.sin(t * 2.5 + i * 0.8) * 3;
    ctx.save();
    ctx.translate(obj.x, obj.y + bobY);
    ctx.font = obj.size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ilState.emoji, 0, 0);
    ctx.restore();
  });

  // Step indicator
  ctx.fillStyle = '#9C27B0';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  var stepText = ilState.step === 'count' ? '第1步：数一数有多少个 ' + ilState.emoji + ' ？' : '第2步：' + ilState.correctNumber + ' 个 ' + ilState.emoji + ' 的英文是什么？';
  ctx.fillText(stepText, W / 2, 335);

  if (ilState.step === 'count') {
    // Number buttons
    var btnW = 70, btnH = 55, gap = 14;
    var totalW = ilState.numberOptions.length * btnW + (ilState.numberOptions.length - 1) * gap;
    var startX = (W - totalW) / 2;
    var btnY = 360;

    ilState.numberOptions.forEach(function (num, i) {
      var bx = startX + i * (btnW + gap);
      var isWrong = num === ilState.wrongIdx;

      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      rrect(bx + 2, btnY + 2, btnW, btnH, 12);
      ctx.fill();

      var grad = ctx.createLinearGradient(bx, btnY, bx, btnY + btnH);
      if (isWrong) {
        grad.addColorStop(0, '#EF9A9A');
        grad.addColorStop(1, '#E53935');
      } else {
        grad.addColorStop(0, '#CE93D8');
        grad.addColorStop(1, '#8E24AA');
      }
      ctx.fillStyle = grad;
      rrect(bx, btnY, btnW, btnH, 12);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      rrect(bx + 2, btnY + 2, btnW - 4, btnH / 2 - 2, 10);
      ctx.fill();

      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(num, bx + btnW / 2, btnY + 36);
    });
  } else {
    // Word buttons (2x2 grid)
    var gx = W / 2 - 170, gy = 360, gbw = 155, gbh = 55, ggap = 14;
    var gpos = [
      { x: gx, y: gy },
      { x: gx + gbw + ggap, y: gy },
      { x: gx, y: gy + gbh + ggap },
      { x: gx + gbw + ggap, y: gy + gbh + ggap },
    ];

    ilState.wordOptions.forEach(function (opt, i) {
      var pos = gpos[i];
      var isWrong = i === ilState.wrongIdx;

      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      rrect(pos.x + 2, pos.y + 2, gbw, gbh, 10);
      ctx.fill();

      var grad = ctx.createLinearGradient(pos.x, pos.y, pos.x, pos.y + gbh);
      if (isWrong) {
        grad.addColorStop(0, '#EF9A9A');
        grad.addColorStop(1, '#E53935');
      } else {
        grad.addColorStop(0, '#81C784');
        grad.addColorStop(1, '#388E3C');
      }
      ctx.fillStyle = grad;
      rrect(pos.x, pos.y, gbw, gbh, 10);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      rrect(pos.x + 2, pos.y + 2, gbw - 4, gbh / 2 - 2, 8);
      ctx.fill();

      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(opt.en, pos.x + gbw / 2, pos.y + gbh / 2 + 5);
    });
  }

  // Feedback
  if (ilState.feedback) {
    var fAlpha = Math.min(1, ilState.feedbackTimer / 600);
    var fY = 450 + (1 - fAlpha) * 20;
    ctx.fillStyle = 'rgba(255,255,255,' + fAlpha + ')';
    ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ilState.feedback, W / 2, fY);
  }

  // Hint
  ctx.fillStyle = '#8D6E63';
  ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('👆 先数数，再认单词，双重挑战！', W / 2, 510);

  // Streak
  if (ilState.streak >= 2) {
    var streakAlpha3 = 0.6 + Math.sin(t * 3) * 0.3;
    ctx.fillStyle = 'rgba(106,27,154,' + streakAlpha3 + ')';
    ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔥 连对 ' + ilState.streak + ' 次！', W / 2, 540);
  }

  drawParticles();
}

function ilUpdate(dt) {
  updateParticles();
  if (ilState.feedbackTimer > 0) {
    ilState.feedbackTimer -= dt;
    if (ilState.feedbackTimer <= 0) {
      ilState.feedbackTimer = 0;
      ilState.feedback = '';
      ilState.wrongIdx = -1;
      ilInitRound();
    }
  }
}

function ilHandleClick(x, y) {
  if (isInsideBackButton(x, y)) {
    switchMode(MODES.MENU);
    return;
  }
  if (ilState.feedbackTimer > 0) return;

  if (ilState.step === 'count') {
    var btnW = 70, btnH = 55, gap = 14;
    var totalW = ilState.numberOptions.length * btnW + (ilState.numberOptions.length - 1) * gap;
    var startX = (W - totalW) / 2;
    var btnY = 360;

    for (var i = 0; i < ilState.numberOptions.length; i++) {
      var bx = startX + i * (btnW + gap);
      if (x >= bx && x <= bx + btnW && y >= btnY && y <= btnY + btnH) {
        var chosen = ilState.numberOptions[i];
        if (chosen === ilState.correctNumber) {
          ilState.countAnswer = chosen;
          ilState.step = 'word';
          playPickupSound();
          spawnSparkles(x, y, 8);
        } else {
          ilState.wrongIdx = chosen;
          ilState.feedback = '❌ 再数一遍！';
          ilState.feedbackTimer = 800;
          playTone(200, 0.3, 'sawtooth', 0.06, 80);
        }
        break;
      }
    }
  } else if (ilState.step === 'word') {
    var gx = W / 2 - 170, gy = 360, gbw = 155, gbh = 55, ggap = 14;
    var gpos = [
      { x: gx, y: gy },
      { x: gx + gbw + ggap, y: gy },
      { x: gx, y: gy + gbh + ggap },
      { x: gx + gbw + ggap, y: gy + gbh + ggap },
    ];

    for (var j = 0; j < ilState.wordOptions.length; j++) {
      var pos = gpos[j];
      if (x >= pos.x && x <= pos.x + gbw && y >= pos.y && y <= pos.y + gbh) {
        if (ilState.wordOptions[j].en === ilState.correctWord.en) {
          ilState.score += 20;
          scoreEl.textContent = ilState.score;
          ilState.streak++;
          if (ilState.streak > ilState.bestStreak) ilState.bestStreak = ilState.streak;
          ilState.feedback = '✅ 完美！' + ilState.correctNumber + ' 个 ' + ilState.correctWord.cn + ' = ' + ilState.correctWord.en;
          ilState.feedbackTimer = 1500;
          spawnSparkles(x, y, 15);
          playStationSound();
        } else {
          ilState.streak = 0;
          ilState.wrongIdx = j;
          ilState.feedback = '❌ 不对哦～正确答案是 ' + ilState.correctWord.en;
          ilState.feedbackTimer = 1400;
          ilState.step = 'count';
          ilState.countAnswer = -1;
          playTone(200, 0.3, 'sawtooth', 0.06, 80);
        }
        break;
      }
    }
  }
}

// ═══════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════
let lastTime = performance.now();

function gameLoop(time) {
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;

  // Menu mode
  if (gameMode === MODES.MENU) {
    ctx.clearRect(0, 0, W, H);
    drawMenu();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Number Learning mode
  if (gameMode === MODES.NUMBERS) {
    ctx.clearRect(0, 0, W, H);
    nlUpdate(dt);
    nlDraw();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Word Learning mode
  if (gameMode === MODES.WORDS) {
    ctx.clearRect(0, 0, W, H);
    wlUpdate(dt);
    wlDraw();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Interactive Learning mode
  if (gameMode === MODES.INTERACTIVE) {
    ctx.clearRect(0, 0, W, H);
    ilUpdate(dt);
    ilDraw();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Original garbage truck game
  updateClouds();
  updateTruck();
  updateBins(dt);
  updateParticles();

  // Update engine sound
  const isMoving = truck.state === 'moving' || truck.state === 'to_station';
  updateEngineSound(truck.speed, isMoving);

  // Render
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawHouses();
  drawTrees();
  drawFlowers();
  drawRoad();
  drawStation();

  // Draw bins (skip the one being dumped)
  bins.forEach(b => {
    if (truck.state === 'dumping' && b === truck.dumpBin) return;
    drawBin(b);
  });

  // Draw truck
  drawTruck();

  // Draw arm with lifted bin during dumping
  if (truck.state === 'dumping' && truck.dumpBin) {
    ctx.save();
    ctx.translate(truck.x, truck.y);
    ctx.rotate(truck.angle);
    const progress = clamp(1 - (truck.dumpTimer / DUMP_DURATION), 0, 1);
    drawArmAndBin(progress);
    ctx.restore();
  }

  drawParticles();
  drawUI();

  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
truck.angle = 0;
requestAnimationFrame(gameLoop);
</script>
