services:
  yuanbao:
    image: "${CODINGHUB_IMAGE}"
    environment:
      PORT: "${CODINGHUB_CONTAINER_PORT}"
      DATA_FILE: "/data/yuanbao.json"
    ports:
      - "${CODINGHUB_HOST_PORT}:${CODINGHUB_CONTAINER_PORT}"
    volumes:
      - yuanbao-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT||8887)+'/',r=>{process.exit(r.statusCode!==200?1:0)}).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  yuanbao-data: