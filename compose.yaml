services:
  yuanbao:
    image: "${CODINGHUB_IMAGE}"
    environment:
      PORT: "${CODINGHUB_CONTAINER_PORT}"
      DATA_FILE: "/data/yuanbao.json"
    ports:
      - "${CODINGHUB_HOST_PORT}:${CODINGHUB_CONTAINER_PORT}"
    volumes:
      - yuanbao-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  yuanbao-data:
